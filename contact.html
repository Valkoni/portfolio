<main>
<section>
  <h2>Свържете се с мен</h2>
  <form action="#" method="post">
    <fieldset>
      <legend>Данни за контакт</legend>
      <label for="name">Име</label>
      <input type="text" id="name" name="name" required>
      <label for="email">Имейл</label>
      <input type="email" id="email" name="email" required>
    </fieldset>
    <fieldset>
      <legend>Вашето запитване</legend>
      <label for="type">Тип запитване</label>
      <select id="type" name="type">
        <option>Въпрос</option>
        <option>Предложение за проект</option>
        <option>Обратна връзка</option>
      </select>
      <label for="subject">Тема</label>
      <input type="text" id="subject" name="subject" required>
      <label for="message">Съобщение</label>
      <textarea id="message" name="message" rows="6" required></textarea>
    </fieldset>
    <button type="submit">Изпрати съобщението</button>
  </form>
</section>
</main>
